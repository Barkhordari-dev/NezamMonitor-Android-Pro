workflows:
  android-debug:
    name: NezamMonitor Android Debug
    max_build_duration: 30
    environment:
      java: 17
      gradle: 8.5
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build Debug APK
        script: ./gradlew assembleDebug
      - name: Run Unit Tests
        script: ./gradlew test
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      scripts:
        - name: Copy APK to artifacts
          script: |
            cp app/build/outputs/apk/debug/*.apk $CM_ARTIFACT_DIR/
      email:
        recipients:
          - dev@example.com

  android-release:
    name: NezamMonitor Android Release
    max_build_duration: 30
    environment:
      java: 17
      gradle: 8.5
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build Release APK
        script: ./gradlew assembleRelease
      - name: Build AAB
        script: ./gradlew bundleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
    publishing:
      scripts:
        - name: Copy artifacts
          script: |
            cp app/build/outputs/apk/release/*.apk $CM_ARTIFACT_DIR/
            cp app/build/outputs/bundle/release/*.aab $CM_ARTIFACT_DIR/
